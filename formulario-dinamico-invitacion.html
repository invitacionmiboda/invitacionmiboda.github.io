function renderForm() {
  container.innerHTML = '';
  templateData.sections.sort((a, b) => a.position - b.position);

  templateData.sections.forEach((section, index) => {
    const div = document.createElement('div');
    div.className = 'section-card';
    div.draggable = true;
    div.dataset.index = index;

    div.innerHTML = `
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5>${section.name}</h5>
        <span class="drag-handle">☰</span>
      </div>
      <label class="form-check-label mb-2">
        <input type="checkbox" class="form-check-input visible-toggle" ${section.visible ? 'checked' : ''}> Visible
      </label>
      <div class="controls">
        ${section.controls.map(ctrl => {
          const propKey = ctrl.name.split('_').pop().toLowerCase();
          const value = section[propKey] || '';
          const labelText = ctrl.label; // ✅ Usamos el label del JSON

          if (ctrl.type === 'textbox') {
            return `
              <div class="mb-3">
                <label class="form-label">${labelText}</label>
                <input type="text" class="form-control" name="${ctrl.name}" value="${value}" maxlength="${ctrl.maxLength || ''}" placeholder="${labelText}">
              </div>`;
          } else if (ctrl.type === 'textarea') {
            return `
              <div class="mb-3">
                <label class="form-label">${labelText}</label>
                <textarea class="form-control" name="${ctrl.name}" maxlength="${ctrl.maxLength || ''}" placeholder="${labelText}">${value}</textarea>
              </div>`;
          } else if (ctrl.type === 'file') {
            return `
              <div class="mb-3">
                <label class="form-label">${labelText}</label>
                <input type="file" class="form-control file-input" name="${ctrl.name}">
                <div class="preview-container mt-2"></div>
              </div>`;
          } else if (ctrl.type === 'file-multiple') {
            return `
              <div class="mb-3">
                <label class="form-label">${labelText}</label>
                <input type="file" class="form-control file-multiple-input" name="${ctrl.name}" multiple>
                <div class="gallery-container mt-2"></div>
              </div>`;
          } else if (ctrl.type === 'select') {
            return `
              <div class="mb-3">
                <label class="form-label">${labelText}</label>
                <select class="form-select" name="${ctrl.name}">
                  ${ctrl.options.map(o => `<option value="${o}" ${value === o ? 'selected' : ''}>${o}</option>`).join('')}
                </select>
              </div>`;
          } else if (ctrl.type === 'date') {
            return `
              <div class="mb-3">
                <label class="form-label">${labelText}</label>
                <input type="date" class="form-control" name="${ctrl.name}" value="${section[propKey] || ''}">
              </div>`;
          }
        }).join('')}
      </div>
    `;
    container.appendChild(div);
  });

  enableDragAndDrop();
}



container.addEventListener('change', e => {
  // Foto individual
  if (e.target.classList.contains('file-input')) {
    const previewContainer = e.target.nextElementSibling;
    previewContainer.innerHTML = '';
    const file = e.target.files[0];
    if (file && file.type.startsWith('image/')) {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      img.style.width = '80px';
      img.style.height = '80px';
      img.style.objectFit = 'cover';
      img.style.borderRadius = '6px';
      previewContainer.appendChild(img);
    }
  }
  // Galería múltiple
  if (e.target.classList.contains('file-multiple-input')) {
    const galleryContainer = e.target.parentElement.querySelector('.gallery-container');
    const newFiles = Array.from(e.target.files);

    // Combinar con existentes y eliminar duplicados
    const combined = [...galleryFiles, ...newFiles];
    const unique = combined.filter((file, index, self) =>
      index === self.findIndex(f => f.name === file.name)
    );

    // Limitar a 10
    galleryFiles = unique.slice(0, 10);

    // Renderizar galería
    renderGallery(galleryContainer);
  }
});

function renderGallery(container) {
  container.innerHTML = '';
  galleryFiles.forEach(file => {
    if (file.type.startsWith('image/')) {
      const item = document.createElement('div');
      item.className = 'gallery-item';
      item.draggable = true;
      item.dataset.filename = file.name;

      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      img.style.width = '60px';
      img.style.height = '60px';
      img.style.objectFit = 'cover';
      img.style.borderRadius = '4px';

      const name = document.createElement('span');
      name.textContent = file.name;
      name.style.flex = '1';

      const deleteBtn = document.createElement('button');
      deleteBtn.textContent = '✕';
      deleteBtn.className = 'btn btn-sm btn-danger';
      deleteBtn.addEventListener('click', () => {
        galleryFiles = galleryFiles.filter(f => f.name !== file.name);
        renderGallery(container);
      });

      item.appendChild(img);
      item.appendChild(name);
      item.appendChild(deleteBtn);
      container.appendChild(item);
    }
  });

  enableGalleryDragAndDrop(container);
}

function enableGalleryDragAndDrop(container) {
    let draggedItem = null;

    container.querySelectorAll('.gallery-item').forEach(item => {
        item.addEventListener('dragstart', (e) => {
            draggedItem = item;
            item.classList.add('dragging');
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", item.dataset.filename);
        });

        item.addEventListener('dragend', () => {
            item.classList.remove('dragging');
            draggedItem = null;
            updateGalleryOrder(container);
        });
    });

    container.addEventListener('dragover', (e) => {
        e.preventDefault();
        const dragging = container.querySelector('.dragging');
        if (!dragging) return;

        const siblings = [...container.querySelectorAll('.gallery-item:not(.dragging)')];
        let insertBefore = null;

        for (const sib of siblings) {
            const box = sib.getBoundingClientRect();
            const middle = box.top + box.height / 2;

            if (e.clientY < middle) {
                insertBefore = sib;
                break;
            }
        }

        container.insertBefore(dragging, insertBefore);
    });
}


function getDragAfterElement(container, y) {
  const draggableElements = [...container.querySelectorAll('.gallery-item:not(.dragging)')];
  return draggableElements.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closest.offset) {
      return { offset: offset, element: child };
    } else {
      return closest;
    }
  }, { offset: Number.NEGATIVE_INFINITY }).element;
}

function updateGalleryOrder(container) {
  const newOrder = [];
  container.querySelectorAll('.gallery-item').forEach(item => {
    const filename = item.dataset.filename;
    const file = galleryFiles.find(f => f.name === filename);
    if (file) newOrder.push(file);
  });
  galleryFiles = newOrder;
}
